<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#2c3e50"/>
  <text x="20" y="35" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">QuietPatch - Vulnerability Report</text>
  
  <!-- Summary Bar -->
  <rect x="20" y="80" width="760" height="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="105" fill="#495057" font-family="Arial, sans-serif" font-size="14">Scanned 2 apps • 1 vulnerable • 0 critical (0 KEV) • 0 unknowns</text>
  
  <!-- Safety Notice -->
  <rect x="20" y="140" width="760" height="30" fill="#fff3cd" stroke="#ffeaa7" stroke-width="1"/>
  <text x="30" y="160" fill="#856404" font-family="Arial, sans-serif" font-size="12">⚠ Safety Notice: Commands are suggestions. Review before running. Never execute commands without understanding what they do.</text>
  
  <!-- Search Bar -->
  <rect x="20" y="190" width="300" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="210" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">Search app or CVE</text>
  
  <!-- Filter Buttons -->
  <rect x="340" y="190" width="60" height="30" fill="#007bff" stroke="#007bff" stroke-width="1"/>
  <text x="350" y="210" fill="white" font-family="Arial, sans-serif" font-size="12">All</text>
  
  <rect x="410" y="190" width="60" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="420" y="210" fill="#495057" font-family="Arial, sans-serif" font-size="12">Low</text>
  
  <rect x="480" y="190" width="80" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="490" y="210" fill="#495057" font-family="Arial, sans-serif" font-size="12">Medium</text>
  
  <rect x="570" y="190" width="60" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="580" y="210" fill="#495057" font-family="Arial, sans-serif" font-size="12">High</text>
  
  <rect x="640" y="190" width="80" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="650" y="210" fill="#495057" font-family="Arial, sans-serif" font-size="12">Critical</text>
  
  <!-- Table Header -->
  <rect x="20" y="240" width="760" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">App</text>
  <text x="200" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Version</text>
  <text x="300" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Action</text>
  <text x="500" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CVE</text>
  <text x="600" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CVSS</text>
  <text x="650" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Severity</text>
  <text x="720" y="260" fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold">KEV</text>
  
  <!-- ExampleApp Row -->
  <rect x="20" y="270" width="760" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="290" fill="#495057" font-family="Arial, sans-serif" font-size="12">ExampleApp</text>
  <text x="200" y="290" fill="#495057" font-family="Arial, sans-serif" font-size="12">1.2.3</text>
  <text x="300" y="290" fill="#28a745" font-family="Arial, sans-serif" font-size="12">✓ No vulnerabilities</text>
  <text x="500" y="290" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="600" y="290" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="650" y="290" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="720" y="290" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">—</text>
  
  <!-- OpenSSL Row -->
  <rect x="20" y="300" width="760" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="320" fill="#495057" font-family="Arial, sans-serif" font-size="12">OpenSSL</text>
  <text x="200" y="320" fill="#495057" font-family="Arial, sans-serif" font-size="12">3.0.0</text>
  <text x="300" y="320" fill="#dc3545" font-family="Arial, sans-serif" font-size="12">⚠ Update available</text>
  <text x="500" y="320" fill="#495057" font-family="Arial, sans-serif" font-size="12">CVE-2099-0001</text>
  <text x="600" y="320" fill="#495057" font-family="Arial, sans-serif" font-size="12">8.1</text>
  <text x="650" y="320" fill="#dc3545" font-family="Arial, sans-serif" font-size="12">High</text>
  <text x="720" y="320" fill="#6c757d" font-family="Arial, sans-serif" font-size="12">—</text>
  
  <!-- EPSS Row -->
  <rect x="20" y="330" width="760" height="30" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">EPSS</text>
  <text x="200" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">0.15</text>
  <text x="300" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">Mock vulnerability</text>
  <text x="500" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="600" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="650" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">—</text>
  <text x="720" y="350" fill="#495057" font-family="Arial, sans-serif" font-size="12">—</text>
  
  <!-- Footer -->
  <rect x="0" y="580" width="800" height="20" fill="#f8f9fa"/>
  <text x="20" y="595" fill="#6c757d" font-family="Arial, sans-serif" font-size="10">Demo Report - Mock data for demonstration purposes only</text>
</svg>
